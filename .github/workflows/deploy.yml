name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resume PDF (print /resume with Playwright)
        run: |
          npx --yes playwright@1 install --with-deps chromium
          npx --yes astro preview --host 127.0.0.1 --port 4321 &
          npx --yes wait-on http://127.0.0.1:4321/resume/
          npx --yes playwright@1 pdf --wait-for-timeout=1000 http://127.0.0.1:4321/resume/ dist/resume.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
